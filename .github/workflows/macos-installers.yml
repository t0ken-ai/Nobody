# Keep this filename so existing README badges and bookmarked Actions URLs work.
name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the Mac SDK/architecture needed by Apple Translation.
          - os: macos-26
            platform: macOS-arm64
            target: darwin-aarch64
            jobs: 2
          - os: windows-latest
            platform: Windows-x64
            target: windows-x86_64
            jobs: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Main and its later release tag share the exact source commit. Reuse only
      # that commit's compilation; never cache signing keys or user directories.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: nobody-release-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            nobody-release-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Check platform and release version
        id: version
        run: node scripts/check-release.mjs
      - run: npm ci
      - name: Check frontend and release metadata
        run: |
          npm run check
          node --test scripts/test-release-metadata.mjs
      - name: Check native translation rules
        if: runner.os == 'macOS'
        run: |
          node scripts/test-selection-layout.mjs
          node scripts/test-translation-models.mjs
      - name: Run Rust tests
        if: runner.os == 'macOS'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Run Windows release tests
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --features custom-protocol
      - name: Verify updater signature and version checks
        run: node scripts/test-updater.mjs
      # Only the bundle step receives the signing key; normal checks and PRs do not.
      - name: Build and verify macOS installers
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package-release.mjs
      - name: Build and verify Windows installer
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package-windows.mjs
      - name: Upload installers
        id: installers
        uses: actions/upload-artifact@v7
        with:
          name: Nobody-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: |
            artifacts/releases/Nobody-*
            artifacts/releases/manifest-${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Add download link to run summary
        shell: bash
        env:
          INSTALLER_URL: ${{ steps.installers.outputs.artifact-url }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF_SUMMARY
          ## $PLATFORM installers ready
          [Download installers, update signatures and SHA-256 checksums]($INSTALLER_URL)
          Sign in to download this test artifact; retained for 30 days.
          Official version tags publish both platforms together in Releases.
          EOF_SUMMARY

  windows-install-test:
    # Keep install failures separate from compilation so reruns can reuse the
    # exact signed artifact and successful build caches, without rebuilding it.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: Nobody-${{ needs.build.outputs.version }}-Windows-x64
          path: artifacts/releases
      - name: Verify Windows clean installation and update mode
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1

  publish:
    # Wait for the entire matrix. Neither builder can overwrite the other's feed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: Nobody-${{ needs.build.outputs.version }}-*
          path: artifacts/releases
          merge-multiple: true
      - name: Verify both platforms and merge update feed
        run: node scripts/merge-updater.mjs artifacts/releases
      - name: Publish the complete release and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/releases
          for checksums in *.sha256; do sha256sum --check "$checksums"; done
          # Retry incomplete drafts only. Never replace a published version's bits.
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "Release $TAG is already published; bump the version instead."
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              ./Nobody-* ./manifest-*.json ./latest.json ./latest.json.sha256
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Nobody $VERSION" --notes-file release-notes.md \
              ./Nobody-* ./manifest-*.json ./latest.json ./latest.json.sha256
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
