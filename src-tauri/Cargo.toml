[package]
name = "nobody"
version = "0.1.3"
edition = "2021"
description = "Translation and local-network text and file sharing for developers"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
litellm-rust = "0.3"
futures-util = "0.3"
# SQLCipher and its random local master-key file persist outside the app install.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
dirs = "6"
rand = "0.9"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util", "fs", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
# LAN traffic has a separate TLS identity and trust store from the LLM client.
mdns-sd = "0.21"
hostname = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
tempfile = "3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tauri-plugin-updater = "2.13"
semver = "1"
tauri-plugin-autostart = "2.6"

[target.'cfg(target_os = "windows")'.dependencies]
# macOS uses CommonCrypto; bundle OpenSSL on Windows for reproducible builds.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
# Encode bounded Shell bitmaps for presentation; never store them with identity.
base64 = "0.22"
png = "0.18"
arboard = { version = "3", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Ole", "Win32_System_Variant"] }

[profile.dev]
debug = 0
incremental = false

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
